spring.application.name=respirabem-api

# --- Servidor (Azure App Service injeta a porta via WEBSITES_PORT; padrão 8080) ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Banco de dados (SQL Server). Nada de credenciais aqui: tudo vem de variáveis de ambiente ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=respirabem;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Erros: não vazar detalhes internos ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
